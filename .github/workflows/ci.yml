name: Build bit7z-python

on:
  push:
    tags:
      - "v*" 

jobs:
  build_wheels_linux_x64:
    name: Build wheels on Linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download bit7z x64 pre-built package
        env:
          BIT7Z_VER: "4.1.0"
        run: |
          wget https://github.com/ZhouSicheng-2011/software-build/releases/download/bit7z-v${BIT7Z_VER}/bit7z-${BIT7Z_VER}-linux-gcc-x64.tar.gz
          tar -xvf bit7z-${BIT7Z_VER}-linux-gcc-x64.tar.gz
          mv bit7z-${BIT7Z_VER} bit7z-linux-gcc-x64
          mkdir -p bit7z_python/7zip
          cp 7zip/7z.so bit7z_python/7zip/7z.so
        
      - name: CI build wheels
        uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-* cp314t-* cp315-* cp315t-*"
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_SKIP: "*-musllinux_*"
          CIBW_ARCHS: x86_64

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ runner.os }}-${{ runner.arch }}
          path: ./wheelhouse/*.whl

  build_wheels_linux_arm64:
    name: Build wheels on Linux (ARM64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Download bit7z arm64 pre-built package
        env:
          BIT7Z_VER: "4.1.0"
        run: |
          wget https://github.com/ZhouSicheng-2011/software-build/releases/download/bit7z-v${BIT7Z_VER}/bit7z-${BIT7Z_VER}-linux-gcc-arm64.tar.gz
          tar -xvf bit7z-${BIT7Z_VER}-linux-gcc-arm64.tar.gz
          mv bit7z-${BIT7Z_VER} bit7z-linux-gcc-arm64
          mkdir -p bit7z_python/7zip
          cp 7zip/7z.so bit7z_python/7zip/7z.so
        
      - name: CI build wheels
        uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-* cp314t-* cp315-* cp315t-*"
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
          CIBW_SKIP: "*-musllinux_*"
          CIBW_ARCHS: aarch64

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ runner.os }}-${{ runner.arch }}
          path: ./wheelhouse/*.whl

  build_wheels_windows_x64:
    name: Build wheels on Windows (x86_64)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Download bit7z x64 pre-built package
        shell: pwsh
        env:
          BIT7Z_VER: "4.1.0"
        run: |
          curl -L -o bit7z-$env:BIT7Z_VER-windows-msvc-x64.tar.gz https://github.com/ZhouSicheng-2011/software-build/releases/download/bit7z-v$env:BIT7Z_VER/bit7z-$env:BIT7Z_VER-windows-msvc-x64.tar.gz
          tar -xvf bit7z-$env:BIT7Z_VER-windows-msvc-x64.tar.gz
          mv bit7z-$env:BIT7Z_VER bit7z-windows-msvc-x64
          mkdir -Force bit7z_python/7zip
          cp 7zip/7z.dll bit7z_python/7zip/7z.dll

      - name: Set up build environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
            arch: x64           
            vsversion: 2022         

      - name: CI build wheels
        uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-* cp314t-* cp315-* cp315t-*"
          CIBW_ARCHS: AMD64

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ runner.os }}-${{ runner.arch }}
          path: ./wheelhouse/*.whl

  build_wheels_macos_arm64:
    name: Build wheels on macOS (ARM64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download bit7z macOS pre-built package
        env:
          BIT7Z_VER: "4.1.0"
        run: |
          wget https://github.com/ZhouSicheng-2011/software-build/releases/download/bit7z-v${BIT7Z_VER}/bit7z-${BIT7Z_VER}-macos-arm64.tar.gz
          tar -xvf bit7z-${BIT7Z_VER}-macos-arm64.tar.gz
          mv bit7z-${BIT7Z_VER} bit7z-macos-arm64
          mkdir -p bit7z_python/7zip
          cp 7zip/7z.dylib bit7z_python/7zip/7z.dylib
        
      - name: CI build wheels
        uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-* cp314t-* cp315-* cp315t-*"
          CIBW_ARCHS: arm64
          CIBW_ENVIRONMENT: >
            MACOSX_DEPLOYMENT_TARGET=11.0

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ runner.os }}-${{ runner.arch }}
          path: ./wheelhouse/*.whl

  release:
    name: Create GitHub Release and upload wheels
    needs: [build_wheels_linux_x64, build_wheels_linux_arm64, build_wheels_windows_x64, build_wheels_macos_arm64]   # 等待构建完成
    runs-on: ubuntu-latest
    # 关键权限：创建 Release 需要写权限
    permissions:
      contents: write
    steps:
      # 下载所有 wheel 文件
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Flatten wheel files
        run: |
          mkdir -p wheels
          find dist/ -name "*.whl" -exec mv {} wheels/ \;
          # 显示所有 wheel 文件（调试用）
          ls -la wheels
          rm -rf dist
          ls -la
      
      - name: Download CHANGELOG.md
        run: |
          wget https://raw.githubusercontent.com/ZhouSicheng-2011/bit7z-python/${{ github.ref_name }}/CHANGELOG.md
          ls -la
      
      # 创建 Release 并上传 wheel 文件
      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: bit7z-python-${{ github.ref_name }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          files: |
            ./wheels/*.whl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete CHANGELOG.md
        run: |
          rm CHANGELOG.md
          ls -la

      - name: Publish to PyPI
        if: ${{ !contains(github.ref_name, 'alpha') && !contains(github.ref_name, 'beta') && !contains(github.ref_name, 'rc') }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN_0 }}
          packages-dir: wheels/